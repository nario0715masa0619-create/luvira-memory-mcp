name: luvira-memory-mcp

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LUVIRA_HOST: 0.0.0.0
      LUVIRA_PORT: 8765
      MEM0_BASE_URL: http://host.docker.internal:8888
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8765/health/live').then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
